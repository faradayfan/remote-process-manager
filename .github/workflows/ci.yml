name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Go test
        run: go test ./...

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build binaries
        run: |
          go build -o command-server ./cmd/command-server
          go build -o agent ./cmd/agent
          go build -o ctl ./cmd/ctl

      - name: Generate mTLS certificates
        run: |
          chmod +x ./scripts/gen-certs.sh
          ./scripts/gen-certs.sh all \
            --agent-id home-01 \
            --server-dns command-server \
            --server-dns localhost \
            --server-ip 127.0.0.1

      - name: Start command-server
        run: |
          ./command-server -config configs/command-server.yaml &
          sleep 3

      - name: Start agent
        run: |
          ./agent &
          sleep 3

      - name: Run smoke test
        run: |
          export GAMESVC_API_KEY="$(grep 'key:' configs/api-keys.yaml | head -1 | awk '{print $2}')"
          chmod +x ./scripts/test-local.sh
          ./scripts/test-local.sh --ci --use-bin --ctl-bin ./ctl
