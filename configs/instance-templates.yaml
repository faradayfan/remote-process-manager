templates:
  minecraft-vanilla:
    command: "java"
    args:
      - "-Xms{{.mem_min}}"
      - "-Xmx{{.mem_max}}"
      - "-jar"
      - "{{.jar_path}}"
      - "nogui"
    cwd: "{{.instance_dir}}"
    env: []
    stop:
      type: "stdin"
      command: "stop\n"
      grace_period: "15s"

  # Lightweight template for CI/CD smoke tests (no external dependencies)
  ci-test:
    command: "sleep"
    args:
      - "{{.duration}}"
    cwd: "{{.instance_dir}}"
    env: []
    stop:
      type: "signal"
      signal: "SIGTERM"
      grace_period: "5s"
